<!DOCTYPE html>

<html>

<head>

    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="box">

    <h1>🔐 Login</h1>

    <form method="POST">

        <input type="text"
        name="mobile"
        placeholder="Mobile Number"
        required>

        <input type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}

    <p style="
    color:red;
    margin-top:15px;
    font-weight:bold;">

    {{ error }}

</p>

{% endif %}

    <br>

    <a href="/register">
        Create Account
    </a>

</div>

</body>

</html>
