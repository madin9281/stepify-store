<!DOCTYPE html>

<html>

<head>

    <title>Checkout</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='style.css') }}">

</head>

<body>

<div class="box"
style="width:500px;">

    <h1>💳 Checkout</h1>

    <form method="POST">

        <input type="text"
        name="name"
        placeholder="Full Name"
        required>

        <input type="text"
        name="phone"
        placeholder="Phone Number"
        required>

        <textarea
        name="address"
        placeholder="Full Address"
        required></textarea>

        <input type="text"
        name="city"
        placeholder="City"
        required>

        <input type="text"
        name="state"
        placeholder="State"
        required>

        <input type="text"
        name="pincode"
        placeholder="Pincode"
        required>

        <select name="payment">

            <option>Cash on Delivery</option>

            <option>UPI Payment</option>

            <option>Credit/Debit Card</option>

            <option>Net Banking</option>

        </select>

        <h3 style="margin-top:20px;">
            🧾 Order Summary
        </h3>

        <p>Delivery Charges - ₹49</p>
        <p>discount for you - ₹99</p>

        

        <button type="submit">
            Place Order
        </button>

    </form>

    {% if success %}

<div style="
margin-top:20px;
padding:15px;
background:#d4edda;
border-radius:10px;">

    <h3>
        ✅ Order Placed Successfully
    </h3>

    <p>
        Saved Address:
    </p>

    <b>{{ saved_address }}</b>

</div>

{% endif %}

</div>

</body>

</html>
